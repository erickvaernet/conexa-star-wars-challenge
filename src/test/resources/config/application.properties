# Settings for the tests only. Spring Boot reads this file in addition to the main
# application.properties, because it is in the "config" folder: it adds to it, it does not replace it.

# Signing key for the tokens issued while the tests run. It is not a secret: it is used nowhere else.
JWT_SECRET=test-only-signing-key-0123456789-abcdef

# Safety net: no test may reach the real SWAPI by accident. Unless a test imports
# SwapiStubConfiguration, which replaces this value with the address of the simulated SWAPI,
# the application looks for SWAPI at a local address where nothing listens.
SWAPI_BASE_URL=http://localhost:1/api
