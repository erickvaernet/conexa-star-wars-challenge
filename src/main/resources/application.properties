spring.application.name=starwars

# Database. The three variables are mandatory: there are no default credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema changes only through Flyway migrations; Hibernate just checks that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Test users. They are loaded only when SEED_ENABLED is true; it is off unless it is set.
auth.seed.enabled=${SEED_ENABLED:false}
# Lets the seed be switched off on a database that already ran it: Flyway would otherwise refuse
# to start because it remembers a migration whose file it no longer reads.
spring.flyway.ignore-migration-patterns=repeatable:missing

# Tokens. JWT_SECRET is mandatory and has no default value: the application checks it at start-up
# and does not start without it. It is left empty here so that check can explain what is missing.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}

# Limit of login attempts. The failed logins are counted by source address: this many of them
# (from 0 to 100; with 0, the limit is off) within this window (from 1s to 24h) block the login
# of that address until the window ends.
auth.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
auth.login.failed-attempts-window=${LOGIN_FAILED_ATTEMPTS_WINDOW:15m}

# SWAPI, the source of the Star Wars data. The address has a default value, so it is optional.
swapi.base-url=${SWAPI_BASE_URL:https://www.swapi.tech/api}
# The longest the application waits for SWAPI: to connect, and for the answer once connected.
# SWAPI slows down with every request, so the second one is generous.
swapi.connect-timeout=${SWAPI_CONNECT_TIMEOUT:3s}
swapi.read-timeout=${SWAPI_READ_TIMEOUT:10s}
# A request that fails in a way that usually goes away by itself is sent again: how many times
# (from 0 to 3; with 0, never) and how long after the failure. Each retry is one more request to
# SWAPI, which limits them, so the default is a single one.
swapi.max-retries=${SWAPI_MAX_RETRIES:1}
swapi.retry-delay=${SWAPI_RETRY_DELAY:200ms}
# Cache of the answers of SWAPI: how long an answer is kept, and how many are kept at most.
# The Star Wars data hardly ever changes, and SWAPI slows down and cuts off whoever asks too much.
swapi.cache.ttl=${SWAPI_CACHE_TTL:1h}
swapi.cache.max-size=${SWAPI_CACHE_MAX_SIZE:500}

# API documentation. The version it shows is the one of the project: the build replaces this
# marker with the version of pom.xml, so it is written in one place only.
api.version=@project.version@
# Swagger UI sorts the groups of requests by name. The login ("Authentication") comes first,
# which is where whoever tries the API has to start.
springdoc.swagger-ui.tags-sorter=alpha

# Each request runs in a virtual thread: waiting for SWAPI does not hold a thread of the system.
spring.threads.virtual.enabled=true

# Actuator: only the health check is exposed, and it shows no internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
