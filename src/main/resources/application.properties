spring.application.name=starwars

# Database. The three variables are mandatory: there are no default credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The schema changes only through Flyway migrations; Hibernate just checks that it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Test users. They are loaded only when SEED_ENABLED is true; it is off unless it is set.
auth.seed.enabled=${SEED_ENABLED:false}
# Lets the seed be switched off on a database that already ran it: Flyway would otherwise refuse
# to start because it remembers a migration whose file it no longer reads.
spring.flyway.ignore-migration-patterns=repeatable:missing

# Tokens. JWT_SECRET is mandatory and has no default value: the application checks it at start-up
# and does not start without it. It is left empty here so that check can explain what is missing.
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}

# Actuator: only the health check is exposed, and it shows no internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
