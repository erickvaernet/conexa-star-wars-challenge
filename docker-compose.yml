# Starts the application and its database: docker compose up
#
# It works without any configuration. To change the development defaults,
# copy .env.example to .env and edit the values.
services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starwars
      POSTGRES_USER: ${DB_USER:-starwars}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-starwars}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/starwars
      DB_USER: ${DB_USER:-starwars}
      DB_PASSWORD: ${DB_PASSWORD:-starwars}
      # Key that signs the login tokens. This default is public, so it is only for local use.
      JWT_SECRET: ${JWT_SECRET:-local-development-signing-key-change-me}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      # Loads the test users, so there is someone to log in with right away.
      SEED_ENABLED: ${SEED_ENABLED:-true}
      # Where the Star Wars data comes from, and the longest the application waits for it.
      SWAPI_BASE_URL: ${SWAPI_BASE_URL:-https://www.swapi.tech/api}
      SWAPI_CONNECT_TIMEOUT: ${SWAPI_CONNECT_TIMEOUT:-3s}
      SWAPI_READ_TIMEOUT: ${SWAPI_READ_TIMEOUT:-10s}
      # How long an answer of SWAPI is kept, and how many are kept at most.
      SWAPI_CACHE_TTL: ${SWAPI_CACHE_TTL:-1h}
      SWAPI_CACHE_MAX_SIZE: ${SWAPI_CACHE_MAX_SIZE:-500}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Docker uses the health check to know when the application is ready.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  db-data:
