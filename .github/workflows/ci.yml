# Runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer run for the same branch or pull request cancels the one in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository.
permissions:
  contents: read

jobs:

  verify:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit, architecture and acceptance tests. The acceptance tests start PostgreSQL with
      # Testcontainers on the Docker of the runner. None of them calls the real SWAPI.
      - name: Run all the tests
        run: ./mvnw -B -ntp verify

      - name: Keep the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

  compose:
    name: Start with docker compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Nothing in this job needs SWAPI. This address, where nothing listens, makes sure that
      # nothing reaches it either.
      SWAPI_BASE_URL: http://localhost:1/api
    steps:
      - uses: actions/checkout@v7

      # CA-19.1, as it is written: the image is built, and the command returns only when the
      # health checks of the database and of the application pass.
      - name: Start the application and its database
        run: docker compose up --build --wait --wait-timeout 300

      - name: The health check reports that the application is ready
        run: |
          curl --fail --silent --show-error http://localhost:8080/actuator/health \
            | jq --exit-status '.status == "UP"'

      # The credentials are the ones of the test user, which the README publishes.
      - name: The test user can log in
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"username": "demo", "password": "demo1234"}' \
            http://localhost:8080/api/v1/auth/login \
            | jq --exit-status '.accessToken | length > 0'

      - name: A list without a token is answered with 401
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/api/v1/people)
          test "$status" = "401"

      - name: Show the logs if something failed
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop
        if: ${{ always() }}
        run: docker compose down --volumes
